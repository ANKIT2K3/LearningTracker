spring.application.name=Backend
server.port=${PORT:8081}

# MySQL Configuration
# Uses environment variables in production (e.g. Render/AWS/Docker)
# and falls back to local configuration for seamless development
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/learning_tracker}
spring.datasource.username=${DB_USERNAME:tracker_app}
spring.datasource.password=${DB_PASSWORD:Ankit@db26}

# Initial Coordinator Account Configuration
# Can be overridden via COORDINATOR_EMAIL and COORDINATOR_PASSWORD environment variables
app.coordinator.email=${COORDINATOR_EMAIL:coordinator@learnflow.app}
app.coordinator.password=${COORDINATOR_PASSWORD:Coordinator@123}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JDBC Session Configuration
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
